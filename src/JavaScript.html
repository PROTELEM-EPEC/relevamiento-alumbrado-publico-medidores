<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVGx8m5z6aRxQG7CJBp403RGS4e7jhpi__3OMvVQkZ3a8guJDd5CUlf7uI53R4N3qB/exec";
  var STORAGE_KEY = "relevamiento_alumbrado_borrador_v1";
  var poleCounter = 0;
  var polesData = new Map();
  var saveTimer = null;

  var svgPinJs = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle; display:inline-block;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
  var svgTrashJs = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; display:inline-block;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  var svgCameraJs = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; display:inline-block;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>';
  var svgGpsJs = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; display:inline-block;"><polygon points="12 2 19 21 12 17 5 21 12 2"></polygon></svg>';

  // Funcion de inicializacion robusta con recuperacion de borrador
  function initApp() {
    try {
      var fechaInput = document.getElementById("field-fecha");
      if (fechaInput && !fechaInput.value) {
        var today = new Date().toISOString().split("T")[0];
        fechaInput.value = today;
      }

      var btnAdd = document.getElementById("btn-add-pole");
      if (btnAdd) {
        btnAdd.onclick = function () {
          agregarPoste();
          guardarBorradorLocal();
        };
      }

      var btnSubmit = document.querySelector(".btn-submit");
      if (btnSubmit) {
        btnSubmit.onclick = enviarRelevamiento;
      }

      // Delegar autoguardado en tiempo real en todo el formulario
      var formEl = document.getElementById("form-relevamiento");
      if (formEl) {
        formEl.addEventListener("input", debouncedGuardarBorrador);
        formEl.addEventListener("change", guardarBorradorLocal);
      }

      // Intentar recuperar borrador previo guardado en este navegador
      var recuperado = recuperarBorradorLocal();
      if (!recuperado) {
        var container = document.getElementById("postes-container");
        if (container && container.children.length === 0) {
          agregarPoste();
        }
      }
      actualizarResumenPostes();

      // Aviso nativo ante cierre/recarga accidental si hay datos
      window.addEventListener("beforeunload", function (e) {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var draft = JSON.parse(raw);
            if (draft && (draft.medidor || (draft.postes && draft.postes.length > 0))) {
              e.preventDefault();
              e.returnValue = "Hay un relevamiento en curso cargado. Los datos estan resguardados en el borrador de su navegador.";
              return e.returnValue;
            }
          }
        } catch (err) { }
      });

    } catch (err) {
      console.error("Error en initApp:", err);
    }
  }

  // Invocar inmediatamente y respaldar con carga de DOM
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initApp);
  } else {
    initApp();
  }
  setTimeout(initApp, 200);

  // Guardado persistente del borrador en localStorage
  function guardarBorradorLocal() {
    try {
      var medidorInput = document.getElementById("field-medidor");
      var fechaInput = document.getElementById("field-fecha");
      var medidorVal = medidorInput ? medidorInput.value.trim() : "";
      var fechaVal = fechaInput ? fechaInput.value : "";

      var cards = document.querySelectorAll(".pole-card");
      var postesArray = [];

      cards.forEach(function (card, index) {
        var poleId = card.id;
        var memData = polesData.get(poleId) || {};

        var lamparasEl = document.getElementById(poleId + "-lamparas");
        var tipoEl = document.getElementById(poleId + "-tipo");
        var potenciaEl = document.getElementById(poleId + "-potencia");
        var estadoEl = document.getElementById(poleId + "-estado");
        var obsEl = document.getElementById(poleId + "-obs");

        var lamparas = lamparasEl ? (parseInt(lamparasEl.value) || 1) : 1;
        var tipo = tipoEl ? tipoEl.value : "LED";
        var potencia = potenciaEl ? potenciaEl.value : "";
        var estado = estadoEl ? estadoEl.value : "Todas Encienden";
        var obs = obsEl ? obsEl.value.trim() : "";

        postesArray.push({
          id: poleId,
          numero: index + 1,
          cantidadLamparas: lamparas,
          tipoLuminaria: tipo,
          potenciaLuminaria: potencia,
          estadoLuminaria: estado,
          geo: memData.geo || { lat: null, lng: null, acc: null },
          fotos: memData.fotos || [null, null, null],
          observaciones: obs
        });
      });

      // Validar si hay contenido para guardar
      var tieneDatos = medidorVal.length > 0 || postesArray.length > 1 ||
        (postesArray.length === 1 && (
          postesArray[0].cantidadLamparas > 1 ||
          postesArray[0].potenciaLuminaria !== "" ||
          postesArray[0].tipoLuminaria !== "LED" ||
          postesArray[0].estadoLuminaria !== "Todas Encienden" ||
          (postesArray[0].geo && postesArray[0].geo.lat !== null) ||
          (postesArray[0].fotos && postesArray[0].fotos.some(function (f) { return f !== null; })) ||
          postesArray[0].observaciones.length > 0
        ));

      if (!tieneDatos) {
        return;
      }

      var draft = {
        fecha: fechaVal,
        medidor: medidorVal,
        postes: postesArray,
        timestamp: Date.now()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
    } catch (err) {
      console.warn("Aviso: no se pudo guardar el borrador en localStorage:", err);
    }
  }

  function debouncedGuardarBorrador() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(guardarBorradorLocal, 300);
  }

  // Recupera el relevamiento guardado si el navegador fue recargado
  function recuperarBorradorLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var draft = JSON.parse(raw);
      if (!draft || !draft.postes || !Array.isArray(draft.postes) || draft.postes.length === 0) {
        return false;
      }

      // Restaurar cabecera
      if (draft.fecha) {
        var fEl = document.getElementById("field-fecha");
        if (fEl) fEl.value = draft.fecha;
      }
      if (draft.medidor) {
        var mEl = document.getElementById("field-medidor");
        if (mEl) mEl.value = draft.medidor;
      }

      var container = document.getElementById("postes-container");
      if (!container) return false;
      container.innerHTML = "";
      polesData.clear();
      poleCounter = 0;

      // Reconstruir cada poste guardado
      draft.postes.forEach(function (pData) {
        agregarPoste(pData);
      });

      actualizarResumenPostes();

      // Mostrar banner de borrador recuperado
      var aviso = document.getElementById("aviso-borrador");
      if (aviso) {
        aviso.classList.remove("hidden");
      }
      return true;
    } catch (err) {
      console.error("Error al recuperar borrador:", err);
      return false;
    }
  }

  function descartarBorrador() {
    if (confirm("\u00bfDesea descartar el borrador recuperado e iniciar una nueva carga en blanco?")) {
      limpiarBorradorLocal();
      reiniciarFormulario();
    }
  }

  function limpiarBorradorLocal() {
    try {
      localStorage.removeItem(STORAGE_KEY);
      var aviso = document.getElementById("aviso-borrador");
      if (aviso) {
        aviso.classList.add("hidden");
      }
    } catch (err) {
      console.warn("Aviso al limpiar borrador:", err);
    }
  }

  function agregarPoste(initialData) {
    try {
      poleCounter++;
      var poleId = (initialData && initialData.id) ? initialData.id : ("pole-" + Date.now() + "-" + Math.floor(Math.random() * 1000));
      var currentCards = document.querySelectorAll(".pole-card");
      var poleNumber = (initialData && initialData.numero) ? initialData.numero : (currentCards.length + 1);

      var initLamparas = (initialData && initialData.cantidadLamparas) ? initialData.cantidadLamparas : 1;
      var initTipo = (initialData && initialData.tipoLuminaria) ? initialData.tipoLuminaria : "LED";
      var initPotencia = (initialData && initialData.potenciaLuminaria) ? initialData.potenciaLuminaria : "";
      var initEstado = (initialData && initialData.estadoLuminaria) ? initialData.estadoLuminaria : "Todas Encienden";
      var initObs = (initialData && initialData.observaciones) ? initialData.observaciones : "";
      var initGeo = (initialData && initialData.geo) ? initialData.geo : { lat: null, lng: null, acc: null };
      var initFotos = (initialData && initialData.fotos && Array.isArray(initialData.fotos)) ? initialData.fotos : [null, null, null];

      polesData.set(poleId, {
        id: poleId,
        numero: poleNumber,
        fotos: initFotos,
        geo: initGeo
      });

      var container = document.getElementById("postes-container");
      if (!container) {
        console.error("No se encontro el contenedor postes-container");
        return;
      }

      var poleCard = document.createElement("div");
      poleCard.className = "pole-card highlight";
      poleCard.id = poleId;
      poleCard.setAttribute("data-pole-id", poleId);

      var deleteBtnHtml = "";
      if (poleNumber > 1) {
        deleteBtnHtml = '<button type="button" class="btn-remove-pole" onclick="eliminarPoste(\'' + poleId + '\')">' + svgTrashJs + ' <span>Eliminar</span></button>';
      }

      var html = [
        '<div class="pole-header">',
        '  <span class="pole-badge">' + svgPinJs + ' Poste #' + poleNumber + '</span>',
        deleteBtnHtml,
        '</div>',
        '<div class="form-group">',
        '  <label class="form-label">Cantidad de L&aacute;mparas Conectadas <span class="required">*</span></label>',
        '  <div class="counter-box">',
        '    <button type="button" class="btn-counter" onclick="ajustarContador(\'' + poleId + '\', -1)">-</button>',
        '    <input type="number" class="form-input counter-input" id="' + poleId + '-lamparas" value="' + initLamparas + '" min="1" max="20" required onchange="guardarBorradorLocal()">',
        '    <button type="button" class="btn-counter" onclick="ajustarContador(\'' + poleId + '\', 1)">+</button>',
        '  </div>',
        '</div>',
        '<div class="form-group">',
        '  <label class="form-label">Tipo / Tecnolog&iacute;a de Luminaria <span class="required">*</span></label>',
        '  <select class="form-select" id="' + poleId + '-tipo" required onchange="guardarBorradorLocal()">',
        '    <option value="LED"' + (initTipo === 'LED' ? ' selected' : '') + '>LED (Eficiente)</option>',
        '    <option value="Sodio Alta Presion (SAP)"' + (initTipo === 'Sodio Alta Presion (SAP)' ? ' selected' : '') + '>Sodio Alta Presi&oacute;n (SAP - Luz Naranja)</option>',
        '    <option value="Vapor de Mercurio"' + (initTipo === 'Vapor de Mercurio' ? ' selected' : '') + '>Vapor de Mercurio (Luz Blanca)</option>',
        '    <option value="Mezcladora"' + (initTipo === 'Mezcladora' ? ' selected' : '') + '>L&aacute;mpara Mezcladora</option>',
        '    <option value="Otro"' + (initTipo === 'Otro' ? ' selected' : '') + '>Otra / No identificada</option>',
        '  </select>',
        '</div>',
        '<div class="form-group">',
        '  <label class="form-label">Potencia de la Luminaria <span style="font-size:0.75rem; font-weight:normal; color:#64748b;">(Opcional)</span></label>',
        '  <select class="form-select" id="' + poleId + '-potencia" onchange="guardarBorradorLocal()">',
        '    <option value=""' + (initPotencia === '' ? ' selected' : '') + '>No especificada</option>',
        '    <option value="50W"' + (initPotencia === '50W' ? ' selected' : '') + '>50W</option>',
        '    <option value="100W"' + (initPotencia === '100W' ? ' selected' : '') + '>100W</option>',
        '    <option value="150W"' + (initPotencia === '150W' ? ' selected' : '') + '>150W</option>',
        '    <option value="200W"' + (initPotencia === '200W' ? ' selected' : '') + '>200W</option>',
        '    <option value="250W"' + (initPotencia === '250W' ? ' selected' : '') + '>250W</option>',
        '  </select>',
        '</div>',
        '<div class="form-group">',
        '  <label class="form-label">Estado Operativo de las L&aacute;mparas <span class="required">*</span></label>',
        '  <select class="form-select" id="' + poleId + '-estado" required onchange="guardarBorradorLocal()">',
        '    <option value="Todas Encienden"' + (initEstado === 'Todas Encienden' ? ' selected' : '') + '>Todas Encienden Correctamente</option>',
        '    <option value="Apagada / Fuera de Servicio"' + (initEstado === 'Apagada / Fuera de Servicio' ? ' selected' : '') + '>Apagada / Fuera de Servicio</option>',
        '    <option value="Enciende Parcialmente"' + (initEstado === 'Enciende Parcialmente' ? ' selected' : '') + '>Enciende Parcialmente</option>',
        '    <option value="Titilando / Falla Balasto"' + (initEstado === 'Titilando / Falla Balasto' ? ' selected' : '') + '>Titilando / Parpadeo Intermitente</option>',
        '    <option value="Tulipa / Artefacto Roto"' + (initEstado === 'Tulipa / Artefacto Roto' ? ' selected' : '') + '>Tulipa o Carcasa Da&ntilde;ada</option>',
        '  </select>',
        '</div>',
        '<div class="geo-box">',
        '  <div class="geo-header">',
        '    <span style="font-weight:700; font-size:0.85rem; color:#0f172a; display:flex; align-items:center; gap:4px;">',
        '      ' + svgPinJs + ' Ubicaci&oacute;n GPS del Poste',
        '    </span>',
        '    <span class="gps-status' + (initGeo && initGeo.lat ? (initGeo.acc <= 15 ? ' ok' : ' warn') : '') + '" id="' + poleId + '-gps-status">' +
        (initGeo && initGeo.lat ? ('Precisi\u00f3n: \u00b1' + initGeo.acc + 'm') : 'Sin capturar') + '</span>',
        '  </div>',
        '  <button type="button" class="btn-gps" onclick="capturarGPS(\'' + poleId + '\')">',
        '    <span>' + svgGpsJs + '</span>',
        '    <span>Capturar GPS Actual</span>',
        '  </button>',
        '  <div class="geo-coords-grid">',
        '    <div class="geo-coord-item">',
        '      <span class="label">Latitud</span>',
        '      <span class="val" id="' + poleId + '-val-lat">' + (initGeo && initGeo.lat ? Number(initGeo.lat).toFixed(6) : '--') + '</span>',
        '    </div>',
        '    <div class="geo-coord-item">',
        '      <span class="label">Longitud</span>',
        '      <span class="val" id="' + poleId + '-val-lng">' + (initGeo && initGeo.lng ? Number(initGeo.lng).toFixed(6) : '--') + '</span>',
        '    </div>',
        '    <div class="geo-coord-item">',
        '      <span class="label">Precisi&oacute;n</span>',
        '      <span class="val" id="' + poleId + '-val-acc">' + (initGeo && initGeo.acc ? (initGeo.acc + ' m') : '--') + '</span>',
        '    </div>',
        '  </div>',
        '</div>',
        '<div class="photos-section">',
        '  <label class="form-label">Fotograf&iacute;as del Poste (Hasta 3 im&aacute;genes)</label>',
        '  <div class="photos-grid">'
      ];

      for (var sIdx = 0; sIdx < 3; sIdx++) {
        var fotoObj = initFotos[sIdx];
        if (fotoObj && fotoObj.base64) {
          html.push(
            '    <div class="photo-slot has-image" id="' + poleId + '-slot-' + sIdx + '" onclick="dispararCamara(\'' + poleId + '\', ' + sIdx + ')">',
            '      <input type="file" id="' + poleId + '-file-' + sIdx + '" accept="image/jpeg,image/png,image/webp,image/jpg" capture="environment" style="display:none" onchange="procesarFoto(\'' + poleId + '\', ' + sIdx + ', event)">',
            '      <img src="' + fotoObj.base64 + '" class="photo-preview">',
            '      <button type="button" class="photo-delete-btn" onclick="eliminarFoto(\'' + poleId + '\', ' + sIdx + ', event)">&times;</button>',
            '    </div>'
          );
        } else {
          html.push(
            '    <div class="photo-slot" id="' + poleId + '-slot-' + sIdx + '" onclick="dispararCamara(\'' + poleId + '\', ' + sIdx + ')">',
            '      <input type="file" id="' + poleId + '-file-' + sIdx + '" accept="image/jpeg,image/png,image/webp,image/jpg" capture="environment" style="display:none" onchange="procesarFoto(\'' + poleId + '\', ' + sIdx + ', event)">',
            '      <div class="photo-slot-placeholder" id="' + poleId + '-ph-' + sIdx + '">',
            '        <span class="icon">' + svgCameraJs + '</span>',
            '        <span class="text">Foto ' + (sIdx + 1) + '</span>',
            '      </div>',
            '    </div>'
          );
        }
      }

      html.push(
        '  </div>',
        '</div>',
        '<div class="form-group" style="margin-top:14px; margin-bottom:0;">',
        '  <label class="form-label">Observaciones Adicionales del Poste</label>',
        '  <input type="text" class="form-input" id="' + poleId + '-obs" value="' + (initObs ? initObs.replace(/"/g, '&quot;') : '') + '" placeholder="Ej: Poste de hormig&oacute;n inclinado, ramas tocando l&iacute;nea, etc." oninput="debouncedGuardarBorrador()" onchange="guardarBorradorLocal()">',
        '</div>'
      );

      poleCard.innerHTML = html.join("\n");
      container.appendChild(poleCard);
      actualizarResumenPostes();

      if (poleNumber > 1 && !initialData) {
        poleCard.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } catch (err) {
      console.error("Error al agregar poste:", err);
      alert("Error al agregar poste: " + err.message);
    }
  }

  function eliminarPoste(poleId) {
    var card = document.getElementById(poleId);
    if (card) {
      card.remove();
      polesData.delete(poleId);
      renumerarPostes();
      actualizarResumenPostes();
      guardarBorradorLocal();
    }
  }

  function renumerarPostes() {
    var cards = document.querySelectorAll(".pole-card");
    cards.forEach(function (card, index) {
      var num = index + 1;
      var badge = card.querySelector(".pole-badge");
      if (badge) {
        badge.innerHTML = svgPinJs + " Poste #" + num;
      }
      var poleId = card.id;
      if (polesData.has(poleId)) {
        polesData.get(poleId).numero = num;
      }
    });
  }

  function actualizarResumenPostes() {
    var total = document.querySelectorAll(".pole-card").length;
    var summaryEl = document.getElementById("summary-total-postes");
    if (summaryEl) {
      summaryEl.textContent = total + (total === 1 ? " Poste" : " Postes");
    }
  }

  function ajustarContador(poleId, delta) {
    var input = document.getElementById(poleId + "-lamparas");
    if (input) {
      var val = parseInt(input.value) || 1;
      val = Math.max(1, Math.min(20, val + delta));
      input.value = val;
      guardarBorradorLocal();
    }
  }

  function capturarGPS(poleId) {
    var statusElem = document.getElementById(poleId + "-gps-status");
    var valLat = document.getElementById(poleId + "-val-lat");
    var valLng = document.getElementById(poleId + "-val-lng");
    var valAcc = document.getElementById(poleId + "-val-acc");

    if (!navigator.geolocation) {
      statusElem.textContent = "GPS no soportado";
      statusElem.className = "gps-status error";
      alert("La geolocalizacion no esta soportada en este navegador o dispositivo.");
      return;
    }

    statusElem.textContent = "Obteniendo se\u00f1al GPS...";
    statusElem.className = "gps-status warn";

    var options = {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    };

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var lat = pos.coords.latitude;
        var lng = pos.coords.longitude;
        var acc = Math.round(pos.coords.accuracy);

        valLat.textContent = lat.toFixed(6);
        valLng.textContent = lng.toFixed(6);
        valAcc.textContent = acc + " m";

        statusElem.textContent = "Precision: \u00b1" + acc + "m";
        statusElem.className = acc <= 15 ? "gps-status ok" : "gps-status warn";

        if (polesData.has(poleId)) {
          polesData.get(poleId).geo = { lat: lat, lng: lng, acc: acc };
        }
        guardarBorradorLocal();
      },
      function (err) {
        statusElem.textContent = "Error GPS: " + err.message;
        statusElem.className = "gps-status error";
        console.warn("Error Geolocation:", err);
      },
      options
    );
  }

  function dispararCamara(poleId, slotIndex) {
    var fileInput = document.getElementById(poleId + "-file-" + slotIndex);
    if (fileInput) {
      fileInput.click();
    }
  }

  function procesarFoto(poleId, slotIndex, event) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var MAX_DIM = 1280;
        var width = img.width;
        var height = img.height;

        if (width > height) {
          if (width > MAX_DIM) {
            height = Math.round((height * MAX_DIM) / width);
            width = MAX_DIM;
          }
        } else {
          if (height > MAX_DIM) {
            width = Math.round((width * MAX_DIM) / height);
            height = MAX_DIM;
          }
        }

        var canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        var compressedBase64 = canvas.toDataURL("image/jpeg", 0.75);

        if (polesData.has(poleId)) {
          polesData.get(poleId).fotos[slotIndex] = {
            base64: compressedBase64,
            mimeType: "image/jpeg"
          };
        }

        var slot = document.getElementById(poleId + "-slot-" + slotIndex);
        slot.classList.add("has-image");
        slot.innerHTML = '<img src="' + compressedBase64 + '" class="photo-preview">' +
          '<button type="button" class="photo-delete-btn" onclick="eliminarFoto(\'' + poleId + '\', ' + slotIndex + ', event)">&times;</button>';

        guardarBorradorLocal();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function eliminarFoto(poleId, slotIndex, event) {
    event.stopPropagation();
    if (polesData.has(poleId)) {
      polesData.get(poleId).fotos[slotIndex] = null;
    }

    var slot = document.getElementById(poleId + "-slot-" + slotIndex);
    slot.classList.remove("has-image");
    slot.innerHTML = '<input type="file" id="' + poleId + '-file-' + slotIndex + '" accept="image/jpeg,image/png,image/webp,image/jpg" capture="environment" style="display:none" onchange="procesarFoto(\'' + poleId + '\', ' + slotIndex + ', event)">' +
      '<div class="photo-slot-placeholder" id="' + poleId + '-ph-' + slotIndex + '">' +
      '<span class="icon">' + svgCameraJs + '</span>' +
      '<span class="text">Foto ' + (slotIndex + 1) + '</span>' +
      '</div>';

    guardarBorradorLocal();
  }

  function enviarRelevamiento() {
    var medidorInput = document.getElementById("field-medidor");
    var medidorVal = medidorInput.value.trim();
    if (!medidorVal) {
      alert("Por favor ingrese el numero del medidor instalado.");
      medidorInput.focus();
      return;
    }

    var fechaVal = document.getElementById("field-fecha").value;

    var cards = document.querySelectorAll(".pole-card");
    if (cards.length === 0) {
      alert("Debe agregar al menos un poste de luminaria para relevar.");
      return;
    }

    var postesArray = [];
    cards.forEach(function (card, index) {
      var poleId = card.id;
      var memData = polesData.get(poleId) || {};

      var lamparas = parseInt(document.getElementById(poleId + "-lamparas").value) || 1;
      var tipo = document.getElementById(poleId + "-tipo").value;
      var potenciaEl = document.getElementById(poleId + "-potencia");
      var potencia = potenciaEl ? potenciaEl.value : "";
      var estado = document.getElementById(poleId + "-estado").value;
      var obs = document.getElementById(poleId + "-obs").value.trim();

      var fotosValidas = (memData.fotos || []).filter(function (f) { return f !== null; });

      postesArray.push({
        numeroPoste: index + 1,
        cantidadLamparas: lamparas,
        tipoLuminaria: tipo,
        potenciaLuminaria: potencia,
        estadoLuminaria: estado,
        latitud: memData.geo ? memData.geo.lat : null,
        longitud: memData.geo ? memData.geo.lng : null,
        precision: memData.geo ? memData.geo.acc : null,
        fotos: fotosValidas,
        observaciones: obs
      });
    });

    var payload = {
      fecha: fechaVal,
      medidor: medidorVal,
      postes: postesArray
    };

    mostrarModalCarga("Comprimiendo y registrando relevamiento en Google Sheets y Drive...");

    // Si corre nativamente dentro del iframe de Apps Script
    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onEnvioExitoso)
        .withFailureHandler(onEnvioFallido)
        .procesarRelevamiento(payload);
    } else {
      // Modo Standalone / GitHub Pages: Envio HTTP POST directo a Apps Script Web App
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
        .then(function () {
          onEnvioExitoso({
            success: true,
            message: "Relevamiento enviado correctamente a Google Drive y Sheets.",
            totalPostes: postesArray.length
          });
        })
        .catch(function (err) {
          onEnvioFallido(err);
        });
    }
  }

  function mostrarModalCarga(mensaje) {
    document.getElementById("modal-overlay").classList.remove("hidden");
    document.getElementById("modal-spinner").classList.remove("hidden");
    document.getElementById("modal-title").textContent = "Guardando Datos";
    document.getElementById("modal-msg").textContent = mensaje;
    document.getElementById("modal-btn-action").classList.add("hidden");
  }

  function onEnvioExitoso(resp) {
    document.getElementById("modal-spinner").classList.add("hidden");
    if (resp.success) {
      limpiarBorradorLocal();
      document.getElementById("modal-title").innerHTML = "&iexcl;Carga Exitosa!";
      document.getElementById("modal-msg").innerHTML =
        "<strong>" + resp.message + "</strong><br><br>" +
        "Medidor: <strong>" + document.getElementById("field-medidor").value + "</strong><br>" +
        "Postes cargados: <strong>" + resp.totalPostes + "</strong><br><br>" +
        '<span style="font-size:0.8rem; color:#64748b;">Los datos fueron asentados en Google Sheets y las fotos en Google Drive de relevamientocontrolgestion@gmail.com</span>';
      var btn = document.getElementById("modal-btn-action");
      btn.textContent = "Iniciar Nuevo Relevamiento";
      btn.onclick = reiniciarFormulario;
      btn.classList.remove("hidden");
    } else {
      onEnvioFallido(resp.message);
    }
  }

  function onEnvioFallido(error) {
    document.getElementById("modal-spinner").classList.add("hidden");
    document.getElementById("modal-title").textContent = "Error al Guardar";
    document.getElementById("modal-msg").textContent = "Ocurrio un problema: " + (error.message || error);
    var btn = document.getElementById("modal-btn-action");
    btn.textContent = "Cerrar y Reintentar";
    btn.onclick = function () {
      document.getElementById("modal-overlay").classList.add("hidden");
    };
    btn.classList.remove("hidden");
  }

  function reiniciarFormulario() {
    document.getElementById("modal-overlay").classList.add("hidden");
    document.getElementById("form-relevamiento").reset();
    document.getElementById("postes-container").innerHTML = "";
    polesData.clear();
    poleCounter = 0;
    limpiarBorradorLocal();
    var fechaInput = document.getElementById("field-fecha");
    if (fechaInput) {
      fechaInput.value = new Date().toISOString().split("T")[0];
    }
    agregarPoste();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Exportar funciones criticas al objeto global window
  window.agregarPoste = agregarPoste;
  window.eliminarPoste = eliminarPoste;
  window.ajustarContador = ajustarContador;
  window.capturarGPS = capturarGPS;
  window.dispararCamara = dispararCamara;
  window.procesarFoto = procesarFoto;
  window.eliminarFoto = eliminarFoto;
  window.enviarRelevamiento = enviarRelevamiento;
  window.reiniciarFormulario = reiniciarFormulario;
  window.guardarBorradorLocal = guardarBorradorLocal;
  window.debouncedGuardarBorrador = debouncedGuardarBorrador;
  window.descartarBorrador = descartarBorrador;
  window.limpiarBorradorLocal = limpiarBorradorLocal;
</script>
